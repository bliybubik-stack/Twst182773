<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="messenger">
    <div id="messages"></div>

    <!-- Added autocomplete="off" to prevent autofill suggestions -->
    <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off">
    <button id="sendButton">Send</button>

    <!-- Added autocomplete="on" to enable password autofill suggestions -->
    <input id="passwordInput" type="password" placeholder="Password" autocomplete="on">

  </div>

  <script src="app.js"></script>
</body>
</html>
